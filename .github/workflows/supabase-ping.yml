name: Supabase keep-alive ping

# Evita que el proyecto Supabase Free se pause por 7 días de inactividad.
# Requiere configurar en GitHub (Settings -> Secrets and variables -> Actions):
#   SITE_URL             -> URL pública del sitio desplegado (ej. https://tu-app.vercel.app)
#   HEALTHCHECK_SECRET    -> mismo valor que la variable de entorno HEALTHCHECK_SECRET del sitio

on:
  schedule:
    - cron: "0 12 * * 1" # todos los lunes 12:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sSf -H "x-healthcheck-secret: ${{ secrets.HEALTHCHECK_SECRET }}" "${{ secrets.SITE_URL }}/api/health"
